services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - Backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOAD_DIR: /data/uploads
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - tosif_uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  tosif_uploads:
